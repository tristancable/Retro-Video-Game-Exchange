global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "api"
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: "A"
        port: 8000
        refresh_interval: 10s

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]